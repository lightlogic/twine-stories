name: Build and deploy stories

on:
  push:
    branches: [main]
  workflow_dispatch:          # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:                  # don't let two deploys overlap
  group: pages
  cancel-in-progress: true

env:
  TWEEGO_VERSION: 2.1.1
  SUGARCUBE_VERSION: 2.37.3   # must be >= the format-version in each story's StoryData

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tweego
        run: |
          wget -q "https://github.com/tmedwards/tweego/releases/download/v${TWEEGO_VERSION}/tweego-${TWEEGO_VERSION}-linux-x64.zip" -O tweego.zip
          unzip -q tweego.zip -d "$HOME/tweego"
          chmod +x "$HOME/tweego/tweego"

      - name: Install SugarCube
        run: |
          wget -q "https://www.motoslave.net/sugarcube/download.php/2/sugarcube-${SUGARCUBE_VERSION}-for-twine-2.1-local.zip" -O sugarcube.zip
          unzip -q sugarcube.zip -d sugarcube
          rm -rf "$HOME/tweego/storyformats/sugarcube-2"
          mv "$(dirname "$(find sugarcube -name format.js | head -1)")" "$HOME/tweego/storyformats/sugarcube-2"
          "$HOME/tweego/tweego" --list-formats || true   # tweego exits 1 after listing
          grep -q "\"version\":\"${SUGARCUBE_VERSION}\"" "$HOME/tweego/storyformats/sugarcube-2/format.js"

      - name: Build
        run: TWEEGO="$HOME/tweego/tweego" ./build.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4